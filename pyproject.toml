[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flarenet"
version = "1.0.0"
description = "Pipeline-based solar flare nowcasting and M/X forecasting from Aditya-L1, NASA/NOAA GOES and synthetic X-ray lightcurves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "astropy>=5.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# NetCDF reader for the NOAA NCEI GOES-R XRS science files (sci_xrsf-l2-avg1m_*.nc)
netcdf = ["netCDF4>=1.6"]
dev = ["pytest>=7.4", "ruff>=0.4", "netCDF4>=1.6"]

[project.scripts]
flarenet = "flarenet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that train a tiny model"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.uv]
# `uv sync` installs the dev group (pytest, ruff) by default
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.4", "netCDF4>=1.6"]
