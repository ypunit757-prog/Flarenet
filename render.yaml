# Render Blueprint: New > Blueprint > pick this repo. Creates the API service.
services:
  - type: web
    name: flarenet-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FRONTEND_ORIGIN
        sync: false        # set to your Vercel URL, e.g. https://flarenet.vercel.app
      - key: FORECAST_URL
        sync: false        # raw URL of forecast.json on the `data` branch (see docs/DEPLOY.md)
      - key: ALERTS_URL
        sync: false        # raw URL of alerts.json on the `data` branch (the alert history)
      - key: FORWARD_LOG_URL
        sync: false        # raw URL of forward_log.csv, if you publish it (the daily forward test)
      - key: ADMIN_API_KEY
        generateValue: true   # protects /api/admin/*; read it in the Render dashboard
      - key: LOG_LEVEL
        value: INFO
